[project]
name = "doc42"
version = "0.3.0"
description = "Fil rouge Doc42, formation « Maîtrisez l'écosystème Anthropic de bout en bout »"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["reel: appelle la vraie API, necessite --reel"]

[tool.ruff]
line-length = 100
